name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk GlassMate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassMate-apk
          path: GlassMate.apk
      # Рабочая сборка (ветка main) и тестовые (остальные ветки) лежат в разных релизах,
      # чтобы эксперимент не затирал рабочий APK.
      - name: Publish release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GlassMate (последняя сборка)
          body: Автоматическая сборка из ветки main. Скачайте GlassMate.apk и установите на телефон.
          files: GlassMate.apk
          make_latest: true
      - name: Publish release (test)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: GlassMate (тестовая сборка)
          body: Тестовая сборка из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}. Ставится поверх рабочей версии.
          files: GlassMate.apk
          prerelease: true
          make_latest: false
